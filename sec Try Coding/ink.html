    <h1>Y&Y </h1>
<h3> We could have been like yin and yang <br>
I have so much to say, but instead I’m holding my tongue <br>
can hardly breathe, polluted air enters my lung<br> 
My chest so constricted, please remove the gun<br>
My legs want to go, want to run<br>
heart screaming. fuck damn it, I’m done! 
</h3>
